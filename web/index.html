<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141218">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<title>metroweb</title>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Main navigation">
    <button class="iconbtn" id="sideToggle" aria-label="Expand sidebar" aria-expanded="false"></button>
    <div class="logo"><img src="/icon.svg" alt=""><span class="lbl">metroweb</span></div>
    <button class="nv" data-nav="home"></button>
    <button class="nv" data-nav="search"></button>
    <button class="nv" data-nav="library"></button>
    <button class="nv" data-nav="stats"></button>
    <button class="nv" data-nav="queue"></button>
    <div class="grow"></div>
    <button class="nv" id="sideAcc"></button>
  </aside>

  <main id="content" tabindex="-1">
    <div id="view"></div>
  </main>

  <div id="mini" role="region" aria-label="Now playing">
    <div class="info" id="miniInfo" role="button" tabindex="0" aria-label="Open player">
      <img id="miniImg" alt="">
      <div class="meta"><div class="t" id="miniT">—</div><div class="a" id="miniA"></div></div>
    </div>
    <div class="ctl mob">
      <button class="play" id="miniPlay" aria-label="Play/Pause"></button>
      <button class="iconbtn" id="miniNext" aria-label="Next"></button>
    </div>
    <div class="center only-d">
      <div class="ctl">
        <button class="iconbtn" id="dShuf" aria-label="Shuffle"></button>
        <button class="iconbtn" id="dPrev" aria-label="Previous"></button>
        <button class="play iconbtn" id="dPlay" aria-label="Play/Pause"></button>
        <button class="iconbtn" id="dNext" aria-label="Next"></button>
        <button class="iconbtn" id="dRep" aria-label="Repeat"></button>
      </div>
      <div class="seekrow"><span id="dCur">0:00</span><input type="range" id="dBar" min="0" max="1000" value="0" aria-label="Seek"><span id="dDur">0:00</span></div>
    </div>
    <div class="right only-d">
      <button class="iconbtn" id="dFav" aria-label="Like"></button>
      <button class="iconbtn" id="dDl" aria-label="Download"></button>
      <span data-ic="vol" class="volic"></span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
      <button class="iconbtn" id="dSleep" aria-label="Sleep timer" title="Sleep timer"></button>
      <button class="iconbtn" id="dQueue" aria-label="Queue"></button>
      <button class="iconbtn" id="dExpand" aria-label="Full screen player"></button>
    </div>
    <div class="prog" id="miniProg"></div>
  </div>

  <nav id="nav" aria-label="Main navigation">
    <button data-nav="home"><span class="pill"></span><span class="lbl">Home</span></button>
    <button data-nav="search"><span class="pill"></span><span class="lbl">Search</span></button>
    <button data-nav="library"><span class="pill"></span><span class="lbl">Library</span></button>
    <button data-nav="stats"><span class="pill"></span><span class="lbl">Stats</span></button>
  </nav>
</div>

<!-- full screen player -->
<div id="fp" aria-hidden="true">
  <div class="bg"></div>
  <div class="inner">
    <header>
      <button class="iconbtn" id="fpClose" aria-label="Close player"></button>
      <div class="seg" role="tablist" aria-label="Player view">
        <button class="on" data-mode="song" role="tab" aria-selected="true">Song</button>
        <button data-mode="lyrics" role="tab" aria-selected="false">Lyrics</button>
        <button data-mode="video" role="tab" aria-selected="false">Video</button>
      </div>
      <button class="iconbtn" id="fpMore" aria-label="More options"></button>
    </header>
    <div class="stage">
      <img class="cover" id="fpImg" alt="">
      <div class="lyr" id="lyr" hidden aria-live="off"></div>
      <div class="vidbox" id="vidbox" hidden><img class="poster" id="vidPoster" alt=""><video id="fpVid" muted playsinline></video><div class="vspin" id="vspin" hidden><div class="ring"></div><span>Loading video…</span></div></div>
    </div>
    <div class="panel">
      <div class="titles">
        <div class="tt"><div class="t" id="fpT">—</div><button class="a link" id="fpA"></button></div>
        <button class="iconbtn" id="fpFav" aria-label="Like"></button>
      </div>
      <div class="seek">
        <input type="range" id="bar" min="0" max="1000" value="0" aria-label="Seek">
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="iconbtn" id="shuf" aria-label="Shuffle"></button>
        <button class="iconbtn" id="prev" aria-label="Previous"></button>
        <button class="bigplay" id="play" aria-label="Play/Pause"></button>
        <button class="iconbtn" id="next" aria-label="Next"></button>
        <button class="iconbtn" id="rep" aria-label="Repeat"></button>
      </div>
      <div class="foot">
        <button id="fpDl"></button>
        <button id="fpPl"></button>
        <button id="fpQueue"></button>
      </div>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="snack" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto"></audio>
<script src="/shuffle.js"></script>
<script src="/app.js"></script>
</body>
</html>
