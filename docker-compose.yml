services:
  metroweb:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Opcional: rescan automático do Jellyfin depois de cada download.
      JELLYFIN_URL: ""
      JELLYFIN_API_KEY: ""
    volumes:
      - ./music:/music   # troque pela pasta que o Jellyfin monitora
      - ./data:/data     # credenciais e segredo da sessão
