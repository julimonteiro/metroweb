services:
  metroweb:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional: ask Jellyfin to rescan after every download.
      JELLYFIN_URL: ""
      JELLYFIN_API_KEY: ""
    volumes:
      - ./music:/music   # change to the folder Jellyfin watches
      - data:/data       # credentials, playlists, session secret
volumes:
  data:
